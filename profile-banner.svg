<svg width="1280" height="540" viewBox="0 0 1280 540" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#090B24"/><stop offset="0.48" stop-color="#1D1450"/><stop offset="1" stop-color="#40134F"/></linearGradient>
 <linearGradient id="neon" x1="160" y1="70" x2="1110" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#67E8F9"/><stop offset="0.45" stop-color="#A78BFA"/><stop offset="1" stop-color="#F9A8D4"/></linearGradient>
 <radialGradient id="a"><stop stop-color="#22D3EE" stop-opacity=".34"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
 <radialGradient id="b"><stop stop-color="#F472B6" stop-opacity=".3"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
 <pattern id="stars" width="72" height="72" patternUnits="userSpaceOnUse"><circle cx="9" cy="15" r="1.3" fill="#fff" fill-opacity=".38"/><circle cx="54" cy="48" r="1" fill="#C4B5FD" fill-opacity=".45"/><circle cx="33" cy="65" r=".8" fill="#67E8F9" fill-opacity=".4"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter><filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1280" height="540" rx="30" fill="url(#bg)"/><rect width="1280" height="540" rx="30" fill="url(#stars)"/>
<ellipse cx="170" cy="120" rx="300" ry="260" fill="url(#a)" filter="url(#blur)"><animate attributeName="cx" values="170;270;170" dur="11s" repeatCount="indefinite"/></ellipse>
<ellipse cx="1110" cy="445" rx="300" ry="260" fill="url(#b)" filter="url(#blur)"><animate attributeName="cy" values="380;300;380" dur="13s" repeatCount="indefinite"/></ellipse>
<path d="M-30 378C154 274 283 423 448 334C610 247 700 143 865 216C1035 291 1120 362 1310 244" stroke="url(#neon)" stroke-width="2" stroke-opacity=".5" fill="none" stroke-dasharray="8 18"><animate attributeName="stroke-dashoffset" from="0" to="-260" dur="6s" repeatCount="indefinite"/></path>
<path d="M-30 400C165 316 288 446 468 365C625 294 739 207 886 255C1030 302 1147 393 1310 288" stroke="#C4B5FD" stroke-width="1" stroke-opacity=".2" fill="none"/>
<!-- orbiting study icons -->
<g transform="translate(1045 132)" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
 <circle cx="96" cy="96" r="92" stroke="url(#neon)" stroke-width="1.5" stroke-opacity=".5" stroke-dasharray="3 10"/>
 <circle cx="96" cy="96" r="58" stroke="#CBD5E1" stroke-opacity=".18"/>
 <circle cx="96" cy="96" r="20" fill="#0F172A" stroke="url(#neon)" stroke-width="2"><animate attributeName="r" values="18;24;18" dur="3s" repeatCount="indefinite"/></circle>
 <text x="96" y="102" fill="#F8FAFC" font-size="18">✦</text>
 <g><text x="96" y="9" fill="#67E8F9" font-size="25">✎</text><animateTransform attributeName="transform" type="rotate" from="0 96 96" to="360 96 96" dur="10s" repeatCount="indefinite"/></g>
 <g><text x="187" y="103" fill="#F9A8D4" font-size="22">⌘</text><animateTransform attributeName="transform" type="rotate" from="0 96 96" to="-360 96 96" dur="14s" repeatCount="indefinite"/></g>
 <g><text x="96" y="204" fill="#A78BFA" font-size="24">◈</text><animateTransform attributeName="transform" type="rotate" from="0 96 96" to="360 96 96" dur="18s" repeatCount="indefinite"/></g>
</g>
<!-- floating particles -->
<g fill="url(#neon)"><circle cx="760" cy="75" r="3"><animate attributeName="cy" values="75;48;75" dur="4s" repeatCount="indefinite"/></circle><circle cx="875" cy="350" r="4"><animate attributeName="cy" values="350;320;350" dur="5s" repeatCount="indefinite"/></circle><circle cx="990" cy="55" r="2"><animate attributeName="cy" values="55;78;55" dur="3.5s" repeatCount="indefinite"/></circle><circle cx="735" cy="280" r="2"><animate attributeName="cy" values="280;250;280" dur="4.8s" repeatCount="indefinite"/></circle></g>
<g fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif"><text x="82" y="124" font-size="15" letter-spacing="6" fill="#67E8F9">STUDENT • SCHOLAR • EXPLORER</text><text x="78" y="207" font-size="66" font-weight="750">Ahmed Faraz</text><text x="82" y="284" font-size="17" fill="#A5B4FC">Learning deeply. Thinking freely. Growing daily.</text></g>
<g transform="translate(82 430)" font-family="Fira Code,monospace" font-size="14"><text fill="#67E8F9">$ </text><text x="22" fill="#E2E8F0">study</text><text x="76" fill="#F9A8D4">→</text><text x="102" fill="#A78BFA">learn</text><text x="157" fill="#F9A8D4">→</text><text x="183" fill="#67E8F9">create</text><text x="255" fill="#F9A8D4">_</text><animate attributeName="opacity" values="1;.45;1" dur="1.8s" repeatCount="indefinite"/></g>
